<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner to Google Sheets</title>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0; 
      text-align: center;
    }
    
    /* Camera Container full width */
    #reader {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }
    /* Force camera video to fit container */
    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover;
    }

    /* Restrict other elements so text/buttons remain readable */
    h2, #status, .history-section {
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 15px;
      padding-right: 15px;
      box-sizing: border-box;
    }

    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      background-color: #f0f0f0;
      font-weight: bold;
    }
    
    /* Styles for History Table */
    .history-section {
      margin-top: 30px;
      text-align: left;
    }
    .history-controls {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
    }
    th {
      background-color: #f4f4f4;
    }
    button {
      padding: 5px 10px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 3px;
    }
    button:hover { background-color: #0056b3; }
    .btn-delete { background-color: #dc3545; }
    .btn-delete:hover { background-color: #c82333; }
    .status-saved { color: green; font-weight: bold; }
    .status-pending { color: red; font-weight: bold; }

    /* --- Paywall Overlay Styles --- */
    #paywall-overlay {
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.95); 
      z-index: 9999; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      text-align: center;
    }
    .paywall-modal {
      background: white; 
      color: black; 
      padding: 40px 30px; 
      border-radius: 8px; 
      max-width: 400px; 
      width: 90%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .paywall-modal h2 {
      margin-top: 0;
      color: #333;
    }
    .paywall-modal input {
      padding: 10px; 
      width: 80%; 
      margin: 15px 0; 
      border: 1px solid #ccc; 
      border-radius: 4px;
      font-size: 16px;
      text-align: center;
    }
    .paywall-modal button {
      padding: 12px 24px; 
      font-size: 16px;
      margin: 5px;
    }
    .btn-unlock {
      background-color: #28a745;
    }
    .btn-unlock:hover {
      background-color: #218838;
    }
    .btn-buy {
      background-color: #007bff;
    }
    .btn-buy:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Paywall Overlay -->
  <div id="paywall-overlay">
    <div class="paywall-modal">
      <h2>Subscription Required</h2>
      <p>Please enter your premium license key to unlock the QR scanner.</p>
      
      <input type="text" id="licenseKey" placeholder="Enter key (e.g., PREMIUM-2026)">
      <br>
      
      <button class="btn-unlock" onclick="checkLicense()">Unlock Scanner</button>
      
      <br><br>
      <p style="font-size: 14px; color: #555;">Don't have a key?</p>
      <!-- Replace the href link below with your Gumroad, Stripe, or WhatsApp link -->
      <a href="https://wa.me/919478911141?text=Hi,%20I%20want%20to%20buy%20the%20QR%20Scanner" target="_blank" style="text-decoration: none;">
  <button class="btn-buy">Buy Subscription / Get Key</button>
</a>

      <p id="paywall-error" style="color: red; display: none; margin-top: 15px;">Invalid key. Please check your subscription.</p>
    </div>
  </div>

  <h2>QR Code Collector</h2>
  
  <div id="reader"></div>
  
  <div id="status">Initializing Camera...</div>

  <div class="history-section">
    <h3>Scan History</h3>
    <div class="history-controls">
      <button onclick="syncAllUnsaved()">Sync All Unsaved</button>
      <button onclick="resendAll()">Resend All</button>
      <button class="btn-delete" onclick="deleteAllHistory()">Delete All History</button>
    </div>
    <div id="history-table-container"></div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybNtCkYArFfsMpSlkN4WrpXAsohYbiqfI6P4wn7b_Elsqn9uE5uIP89VyZlSdm7bbbHw/exec";
    
    let isProcessing = false;
    let storedScans = JSON.parse(localStorage.getItem("qr_scan_history")) || [];

    // --- Subscription Check Logic ---
    window.onload = function() {
      if (localStorage.getItem("is_subscribed") !== "true") {
        document.getElementById("paywall-overlay").style.display = "flex";
      } else {
        renderTable();
      }
    };

    function checkLicense() {
      const key = document.getElementById("licenseKey").value.trim();
      // Change this to whatever key you want to distribute to paid users
      if (key === "PREMIUM-20261") {
        localStorage.setItem("is_subscribed", "true");
        document.getElementById("paywall-overlay").style.display = "none";
        renderTable();
      } else {
        document.getElementById("paywall-error").style.display = "block";
      }
    }
    // --------------------------------

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      // Unblock camera after 1 second so next QR code can be scanned immediately
      setTimeout(() => {
        isProcessing = false;
      }, 1000);

      const statusEl = document.getElementById("status");
      statusEl.style.backgroundColor = "#fff3cd";
      statusEl.innerText = "QR Scanned! Sending in background...";

      // Split string by '#' and trim whitespace
      const parts = decodedText.split("#").map(item => item.trim());

      const now = new Date();
      
      // Force Date format to DD/MM/YYYY
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const dateStr = `${day}/${month}/${year}`;
      
      const timeStr = now.toLocaleTimeString();

      // Calculate the count for the current date
      const todayScansCount = storedScans.filter(scan => scan.date === dateStr).length;
      const currentCount = todayScansCount + 1;
      
      // Create a unique record for local storage
      const scanRecord = {
        id: Date.now(),
        count: currentCount,
        date: dateStr,
        time: timeStr,
        parts: parts,
        synced: false
      };

      // Save to local storage first and update table immediately
      storedScans.push(scanRecord);
      saveData();

      // Send to Google Sheets asynchronously in the background (NON-BLOCKING)
      sendToGoogleSheets(scanRecord)
        .then(() => {
          statusEl.style.backgroundColor = "#d4edda";
          statusEl.innerText = `Scan #${currentCount} saved to Google Sheets!`;
        })
        .catch(() => {
          statusEl.style.backgroundColor = "#f8d7da";
          statusEl.innerText = "Saved locally (Offline/Pending).";
        });
    }

    // Function to handle fetching to Google Apps Script
    function sendToGoogleSheets(record) {
      const payload = {
        count: record.count,
        date: record.date,
        time: record.time,
        parts: record.parts
      };

      return fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      }).then(() => {
        // Mark as synced in local storage
        const index = storedScans.findIndex(s => s.id === record.id);
        if (index !== -1) {
          storedScans[index].synced = true;
          saveData();
        }
      });
    }

    // --- Local Storage & UI Functions ---

    function saveData() {
      localStorage.setItem("qr_scan_history", JSON.stringify(storedScans));
      renderTable();
    }

    function renderTable() {
      const container = document.getElementById("history-table-container");
      if (storedScans.length === 0) {
        container.innerHTML = "<p>No scans recorded yet.</p>";
        return;
      }

      let html = `<table>
        <tr>
          <th># Count</th>
          <th>Date</th>
          <th>Time</th>
          <th>Lot No.</th>
          <th>Reff. No.</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>`;

      // Show newest scans at the top
      const reversedScans = [...storedScans].reverse();

      reversedScans.forEach(scan => {
        // parts[2] = Column C (Lot No.), parts[3] = Column D (Reff. No.)
        const lotNo = (scan.parts && scan.parts[2] !== undefined) ? scan.parts[2] : "";
        const reffNo = (scan.parts && scan.parts[3] !== undefined) ? scan.parts[3] : "";

        html += `<tr>
          <td><strong>${scan.count || 1}</strong></td>
          <td>${scan.date}</td>
          <td>${scan.time}</td>
          <td>${lotNo}</td>
          <td>${reffNo}</td>
          <td class="${scan.synced ? 'status-saved' : 'status-pending'}">${scan.synced ? 'Saved' : 'Pending'}</td>
          <td>
            <button onclick="resendSingle(${scan.id})" style="margin-bottom:4px;">Resend</button><br>
            <button class="btn-delete" onclick="deleteSingle(${scan.id})">Delete</button>
          </td>
        </tr>`;
      });

      html += `</table>`;
      container.innerHTML = html;
    }

    function resendSingle(id) {
      const record = storedScans.find(s => s.id === id);
      if (record) {
        document.getElementById("status").innerText = "Resending data...";
        sendToGoogleSheets(record).then(() => {
          document.getElementById("status").innerText = "Data resent!";
        });
      }
    }

    function syncAllUnsaved() {
      const unsaved = storedScans.filter(s => !s.synced);
      if (unsaved.length === 0) {
        alert("All data is already synced!");
        return;
      }
      
      document.getElementById("status").innerText = `Syncing ${unsaved.length} items...`;
      
      let promises = unsaved.map(record => sendToGoogleSheets(record));
      
      Promise.all(promises).then(() => {
        document.getElementById("status").innerText = "All pending data synced!";
      });
    }

    function resendAll() {
      if (storedScans.length === 0) {
        alert("No data to resend!");
        return;
      }
      
      if (confirm(`Are you sure you want to resend all ${storedScans.length} scans to Google Sheets? This may create duplicates if they were already saved.`)) {
        document.getElementById("status").innerText = `Resending all ${storedScans.length} items...`;
        
        let promises = storedScans.map(record => sendToGoogleSheets(record));
        
        Promise.all(promises).then(() => {
          document.getElementById("status").innerText = "All data resent successfully!";
        });
      }
    }

    function deleteSingle(id) {
      if (confirm("Delete this scan?")) {
        storedScans = storedScans.filter(s => s.id !== id);
        saveData();
      }
    }

    function deleteAllHistory() {
      if (confirm("Are you sure you want to delete ALL stored scan history?")) {
        storedScans = [];
        saveData();
      }
    }

    // Dynamically calculate scanning box size
    let boxSize = Math.min(window.innerWidth * 0.7, 300);

    // Initialize scanner (FPS set to 30 for continuous fast scanning)
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { fps: 30, qrbox: { width: boxSize, height: boxSize } },
      /* verbose= */ false
    );

    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
