<!DOCTYPE html>
<html>
<head>
    <title>Contractor Monthly Bill</title>
    <!-- Include SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f4f8; color: #2c3e50; }
        
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); 
            max-width: 95%; 
            margin: 20px auto; 
            position: relative;
        }

        .header-section { text-align: center; margin-bottom: 20px; position: relative; }
        .company-name { margin: 0; font-size: 26px; font-weight: bold; text-transform: uppercase; }
        .report-title { color: #2c3e50; font-weight: bold; margin: 5px 0; letter-spacing: 1px; font-size: 16px; }

        .controls {
            display: flex; 
            flex-wrap: wrap;
            justify-content: space-between; 
            align-items: flex-end; 
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        
        .filters-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 9px; font-weight: bold; color: #636e72; margin-bottom: 3px; text-transform: uppercase; }
        input[type="month"], input[type="text"] { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; width: 110px; }
        input[type="number"] { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; width: 55px; }
        .table-input { padding: 4px; border: 1px solid #ced4da; border-radius: 4px; font-size: 12px; width: 70px; text-align: center; }

        .btn-group { display: flex; gap: 10px; }
        .action-btn { 
            padding: 10px 18px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px; 
            color: white; 
            transition: opacity 0.2s;
        }
        .action-btn:hover { opacity: 0.9; }
        .btn-refresh { background: #3498db; }
        .btn-excel { background: #27ae60; }
        .btn-print { background: #e74c3c; }

        /* Table Styling */
        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; color: #000; }
        
        th { 
            background: #f2f2f2; 
            color: #2c3e50; 
            padding: 10px 4px; 
            border: 1px solid #bbb; 
            text-align: center; 
            font-weight: bold;
        }
        
        td { padding: 6px 4px; border: 1px solid #ccc; text-align: center; }
        tr:nth-child(even) { background-color: #fafafa; }
        
        .text-left { text-align: left; padding-left: 8px; }
        .text-right { text-align: right; padding-right: 8px; }

        .grand-total-row { background: #dfe6e9 !important; font-weight: bold; font-size: 13px; }
        .grand-total-row td { border: 2px solid #2c3e50; }

        @media print {
            @page { size: landscape; margin: 1cm; }
            body { background: white; margin: 0; padding: 0; color: #000 !important; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; margin: 0; padding: 0; }
            .controls, .no-print { display: none !important; }
            
            table { width: 100% !important; font-size: 10pt !important; }
            th { border: 1pt solid #000 !important; -webkit-print-color-adjust: exact !important; background: #eee !important; }
            td { border: 1pt solid #000 !important; }
            .grand-total-row td { border: 2px solid #000 !important; }
            .table-input { border: none !important; background: transparent !important; text-align: center; font-weight: bold; }
        }
    </style>
</head>
<body onload="initBill()">

<div class="container">
    <div class="header-section">
        <h1 class="company-name">Unit-3 Contractor Bill.</h1>
        <p class="report-title">MONTHLY CONTRACTOR BILLING STATEMENT</p>
    </div>

    <div class="controls no-print">
        <div class="filters-group">
            <div class="form-group">
                <label>Billing Month</label>
                <input type="month" id="billMonth" onchange="loadBillData()">
            </div>
            <div class="form-group">
                <label>Contractor Name</label>
                <input type="text" id="contractorName" placeholder="Contractor name...">
            </div>
            <div class="form-group">
                <label>Mixing Rate</label>
                <input type="number" id="mixingRate" value="0.15" step="0.01">
            </div>
            <div class="form-group">
                <label>Yarn Rate</label>
                <input type="number" id="yarnRate" value="0.30" step="0.01">
            </div>
            <div class="form-group">
                <label>Unloading Rate</label>
                <input type="number" id="unloadingRate" value="0.12" step="0.01">
            </div>
            <div class="form-group">
                <label>Loading Rate</label>
                <input type="number" id="loadingRate" value="0.12" step="0.01">
            </div>
            <div class="form-group">
                <label>FRP Bale Rate</label>
                <input type="number" id="frpBaleRate" value="0.06" step="0.01">
            </div>
            <div class="form-group">
                <label>U-3 Waste Rate</label>
                <input type="number" id="u3WasteRate" value="0.06" step="0.01">
            </div>
            <div class="form-group">
                <label>Kanty Rate</label>
                <input type="number" id="kantyRate" value="0.06" step="0.01">
            </div>
            <div class="form-group">
                <label>Mixing Bale Rate</label>
                <input type="number" id="mixingBaleRate" value="0.06" step="0.01">
            </div>
        </div>
        
        <div class="btn-group">
            <button class="action-btn btn-refresh" onclick="loadBillData()">↻ Generate Bill</button>
            <button class="action-btn btn-excel" onclick="exportToExcel()">↓ Export Excel</button>
            <button class="action-btn btn-print" onclick="window.print()">🖨 Print Bill</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="billingTable">
            <thead>
                <tr>
                    <th width="8%">Month</th>
                    <th width="28%">Description of Work</th>
                    <th width="7%">UOM</th>
                    <th width="11%">Total Quantity</th>
                    <th width="11%">Less Qnty</th>
                    <th width="11%">Final Qnty</th>
                    <th width="11%">Rate (₹)</th>
                    <th width="13%">Total Amount (₹)</th>
                </tr>
            </thead>
            <tbody id="billDataBody">
                <tr><td colspan='8'>Select month and click Generate Bill</td></tr>
            </tbody>
            <tfoot id="billFooter">
                <!-- Totals will populate here -->
            </tfoot>
        </table>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxTO3fc8hh7PBrLJI95YECv-H67eWbmzbyB7TDcgLRXGGg0ua-zzWVLMKKwe5jZS63iyw/exec';
    let currentItems = [];

    function initBill() {
        const today = new Date().toISOString().slice(0, 7);
        document.getElementById('billMonth').value = today;
    }

    async function loadBillData() {
        const tbody = document.getElementById('billDataBody');
        const selectedMonth = document.getElementById('billMonth').value;
        
        const mixingRate = parseFloat(document.getElementById('mixingRate').value) || 0;
        const yarnRate = parseFloat(document.getElementById('yarnRate').value) || 0;
        const unloadingRate = parseFloat(document.getElementById('unloadingRate').value) || 0;
        const loadingRate = parseFloat(document.getElementById('loadingRate').value) || 0;
        const frpBaleRate = parseFloat(document.getElementById('frpBaleRate').value) || 0;
        const u3WasteRate = parseFloat(document.getElementById('u3WasteRate').value) || 0;
        const kantyRate = parseFloat(document.getElementById('kantyRate').value) || 0;
        const mixingBaleRate = parseFloat(document.getElementById('mixingBaleRate').value) || 0;
        
        if(!selectedMonth) {
            alert("Please select a billing month.");
            return;
        }

        tbody.innerHTML = "<tr><td colspan='8'>Fetching data from server...</td></tr>";
        document.getElementById('billFooter').innerHTML = "";

        try {
            const [respRawIss, respCotIss, respYarnRec, respRawRec] = await Promise.all([
                fetch(`${API_URL}?Department=RAW_MATERIAL_ISSUE&t=${Date.now()}`),
                fetch(`${API_URL}?Department=COTTON_ISSUE&t=${Date.now()}`),
                fetch(`${API_URL}?Department=YARN_REC&t=${Date.now()}`),
                fetch(`${API_URL}?Department=RAW_MATERIAL_REC&t=${Date.now()}`)
            ]);
            
            const rawIssData = await respRawIss.json();
            const cotIssData = await respCotIss.json();
            const yarnRecData = await respYarnRec.json();
            const rawRecData = await respRawRec.json();

            let qtyMixing = 0;
            let qtyYarnPacked = 0;
            let qtyUnloading = 0;
            let qtyLoading = 0;
            let qtyFRPBaleIssue = 0;
            let qtyU3WasteShifting = 0;
            let qtyKantyBaleShifting = 0;
            let qtyMixingBaleShift = 0;

            // 1. Mixing Unit - 3: RAW_MATERIAL_ISSUE & COTTON_ISSUE -> Issuing To (Dept) == OE Plant Unit no 3
            const checkMixing = (row) => {
                if(!row["Date"]) return;
                const d = row["Date"].split('T')[0];
                if (d.startsWith(selectedMonth)) {
                    const issuingTo = (row["Issuing To (Dept)"] || "").trim().toUpperCase();
                    if (issuingTo === "OE PLANT UNIT NO 3") {
                        qtyMixing += parseFloat(row["Qty (KG)"] || 0);
                    }
                }
            };
            rawIssData.forEach(checkMixing);
            cotIssData.forEach(checkMixing);

            // 2. Yarn Packed: YARN_REC -> Category == OE U-3 Yarn
            yarnRecData.forEach(row => {
                if(!row["Date"]) return;
                const d = row["Date"].split('T')[0];
                if (d.startsWith(selectedMonth)) {
                    const cat = (row["Category"] || "").trim().toUpperCase();
                    if (cat === "OE U-3 YARN") {
                        qtyYarnPacked += parseFloat(row["Qty (KG)"] || 0);
                    }
                }
            });

            // 3. Unloading: RAW_MATERIAL_REC -> Category == Market Purchase Waste or Job Work
            // 6. U - 3 Waste Bale Shifting: RAW_MATERIAL_REC -> Supplier Name == UNIT-3 and Item Description != MICRO DUST
            // 7. Kanty Bale Shifting: RAW_MATERIAL_REC -> Category == Fiber Recycling Plant and Item Description in (Kanty, Kanty Black)
            rawRecData.forEach(row => {
                if(!row["Date"]) return;
                const d = row["Date"].split('T')[0];
                if (d.startsWith(selectedMonth)) {
                    const cat = (row["Category"] || "").trim().toUpperCase();
                    const item = (row["Item Description"] || "").trim().toUpperCase();
                    const supplier = (row["Supplier Name"] || "").trim().toUpperCase();
                    const qty = parseFloat(row["Qty (KG)"] || 0);

                    if (cat === "MARKET PURCHASE WASTE" || cat === "JOB WORK") {
                        qtyUnloading += qty;
                    }
                    if (supplier === "UNIT-3" && item !== "MICRO DUST") {
                        qtyU3WasteShifting += qty;
                    }
                    if (cat === "FIBER RECYCLING PLANT" && (item === "KANTY" || item === "KANTY BLACK")) {
                        qtyKantyBaleShifting += qty;
                    }
                }
            });

            // 4. Loading: RAW_MATERIAL_ISSUE -> Issuing To (Dept) == Sale or Job Work
            // 5. FRP Bale Issue: RAW_MATERIAL_ISSUE -> Issuing To (Dept) == Fiber Recycling Plant
            // 8. Mixing Bale Shift: RAW_MATERIAL_ISSUE -> Issuing To (Dept) == OE Plant Unit no 3 and Category == Fiber Recycling Plant
            rawIssData.forEach(row => {
                if(!row["Date"]) return;
                const d = row["Date"].split('T')[0];
                if (d.startsWith(selectedMonth)) {
                    const issuingTo = (row["Issuing To (Dept)"] || "").trim().toUpperCase();
                    const cat = (row["Category"] || "").trim().toUpperCase();
                    const qty = parseFloat(row["Qty (KG)"] || 0);

                    if (issuingTo === "SALE" || issuingTo === "JOB WORK") {
                        qtyLoading += qty;
                    }
                    if (issuingTo === "FIBER RECYCLING PLANT") {
                        qtyFRPBaleIssue += qty;
                    }
                    if (issuingTo === "OE PLANT UNIT NO 3" && cat === "FIBER RECYCLING PLANT") {
                        qtyMixingBaleShift += qty;
                    }
                }
            });

            currentItems = [
                { desc: "Mixing Unit - 3", qty: qtyMixing, rate: mixingRate },
                { desc: "Yarn Packed U-3", qty: qtyYarnPacked, rate: yarnRate },
                { desc: "Unloading (Mkt Waste & Job Work Neelon)", qty: qtyUnloading, rate: unloadingRate },
                { desc: "Loading (Kanty & Job Work Neelon)", qty: qtyLoading, rate: loadingRate },
                { desc: "Bale Issue to FRP", qty: qtyFRPBaleIssue, rate: frpBaleRate },
                { desc: "U-3 Waste Bale Shifting", qty: qtyU3WasteShifting, rate: u3WasteRate },
                { desc: "Kanty Bale Shifting", qty: qtyKantyBaleShifting, rate: kantyRate },
                { desc: "Mixing Bale Shift", qty: qtyMixingBaleShift, rate: mixingBaleRate }
            ];

            renderTable();

        } catch(error) {
            tbody.innerHTML = `<tr><td colspan='8' style='color:red;'>Error loading data: ${error.message}</td></tr>`;
        }
    }

    function renderTable() {
        const tbody = document.getElementById('billDataBody');
        const tfoot = document.getElementById('billFooter');
        tbody.innerHTML = "";
        
        let displayMonth = document.getElementById('billMonth').value.split('-').reverse().join('/');
        let grandTotalAmount = 0;

        currentItems.forEach((item, index) => {
            let lessQtyInput = document.getElementById(`less-qty-${index}`);
            let lessQty = lessQtyInput ? (parseFloat(lessQtyInput.value) || 0) : 0;
            
            let finalQty = item.qty - lessQty;
            if (finalQty < 0) finalQty = 0;
            
            let amount = finalQty * item.rate;
            grandTotalAmount += amount;

            tbody.innerHTML += `
                <tr>
                    <td>${displayMonth}</td>
                    <td class="text-left"><b>${item.desc}</b></td>
                    <td>KG</td>
                    <td>${item.qty.toFixed(2)}</td>
                    <td><input type="number" class="table-input" id="less-qty-${index}" value="${lessQty}" step="0.01" oninput="updateCalculations(${index})"></td>
                    <td id="fin-qty-${index}">${finalQty.toFixed(2)}</td>
                    <td>${item.rate.toFixed(2)}</td>
                    <td class="text-right" id="amount-${index}">${amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                </tr>
            `;
        });

        tfoot.innerHTML = `
            <tr class="grand-total-row">
                <td colspan="7" class="text-right">GRAND TOTAL</td>
                <td class="text-right" id="grand-total-amount">₹ ${grandTotalAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            </tr>
        `;
    }

    function updateCalculations(index) {
        let lessQtyInput = document.getElementById(`less-qty-${index}`);
        let lessQty = parseFloat(lessQtyInput.value) || 0;
        let item = currentItems[index];

        let finalQty = item.qty - lessQty;
        if (finalQty < 0) finalQty = 0;

        let amount = finalQty * item.rate;

        document.getElementById(`fin-qty-${index}`).innerText = finalQty.toFixed(2);
        document.getElementById(`amount-${index}`).innerText = amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

        let grandTotalAmount = 0;
        currentItems.forEach((it, i) => {
            let lInput = document.getElementById(`less-qty-${i}`);
            let lQty = lInput ? (parseFloat(lInput.value) || 0) : 0;
            let fQty = it.qty - lQty;
            if (fQty < 0) fQty = 0;
            grandTotalAmount += fQty * it.rate;
        });

        document.getElementById('grand-total-amount').innerText = `₹ ${grandTotalAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    function exportToExcel() {
        const contractor = document.getElementById('contractorName').value || 'Contractor';
        const month = document.getElementById('billMonth').value;
        const fileName = `${contractor}_Bill_${month}.xlsx`;
        
        const table = document.getElementById("billingTable");
        const wb = XLSX.utils.table_to_book(table, {sheet: "Monthly Bill"});
        XLSX.writeFile(wb, fileName);
    }
</script>
</body>
</html>
